[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "donglehub"
version = "0.2.0"
description = "Battery + settings hub for the MCHOSE V9 PRO headset and AttackShark X11 mouse on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.scripts]
donglehub = "donglehub.cli:main"
donglehub-gui = "donglehub.gui:run"

[tool.setuptools.packages.find]
include = ["donglehub*"]
